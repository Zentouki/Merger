services:
  merger:
    build: .
    image: merger:latest
    container_name: merger
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"          # reachable from this computer only
    environment:
      MERGER_HOST: 0.0.0.0              # inside the container; the port above limits who can connect
      MERGER_DATA: /data
      MERGER_CLIENT_SECRET: /run/secrets/client_secret
      # MERGER_TOKEN_KEY: ""            # optional: a Fernet key, so the key is not stored beside the data
    volumes:
      # One volume holds accounts.json, auth.json, history.jsonl, secret.key and token.key.
      # A folder is used instead of single-file mounts: Docker turns a missing file into a
      # directory, and the app rewrites these files. To keep them in a visible folder instead,
      # use "./data:/data" (and run: sudo chown 10001:10001 data).
      - merger-data:/data
    secrets:
      - client_secret
    read_only: true                     # the app only writes to /data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  client_secret:
    file: ./client_secret.json          # downloaded from Google Cloud (see README)

volumes:
  merger-data:
