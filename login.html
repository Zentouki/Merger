<style>
:root{--bg:#F8FAFC;--border:#E2E8F0;--ink:#0F172A;--sec:#475569;--muted:#94A3B8;--brand:#4F46E5;--brand-h:#4338CA}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI Variable Text","Segoe UI Variable","SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"IBM Plex Sans","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:48px 16px;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:448px}
.brand{display:flex;justify-content:center;align-items:center;gap:12px}
.mark{width:32px;height:32px;background:var(--brand);border-radius:6px;display:grid;place-items:center;box-shadow:0 1px 2px #0000000d}
.mark svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.brand span{font-weight:700;font-size:18px;letter-spacing:-.01em}
h2{margin:24px 0 0;text-align:center;font-size:24px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
.sub{margin:8px 0 0;text-align:center;color:var(--sec)}
.card{margin-top:32px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:32px 40px;box-shadow:0 1px 2px #0000000d}
.err{display:flex;gap:8px;align-items:flex-start;margin-bottom:20px;background:#fff1f2;border:1px solid #fecdd3;color:#be123c;font-size:12px;font-weight:500;padding:12px;border-radius:6px}
.err svg{width:16px;height:16px;flex:none;margin-top:2px;stroke:#f43f5e;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.f{margin-bottom:20px}
.f label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--sec)}
.f input{display:block;width:100%;height:40px;margin-top:4px;padding:0 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);font:inherit;color:inherit;box-shadow:0 1px 2px #0000000d}
.f input:focus{outline:0;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px #4f46e51f}
.rm{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--sec);cursor:pointer;margin-bottom:20px}
.rm input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
button{width:100%;height:40px;border:0;border-radius:6px;background:var(--brand);color:#fff;font:600 12px "Segoe UI Variable Text","Segoe UI Variable","SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"IBM Plex Sans","Segoe UI",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;box-shadow:0 1px 2px #0000000d}
button:hover{background:var(--brand-h)}button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.reset{margin:24px 0 0;padding-top:20px;border-top:1px solid #F1F5F9;text-align:center;font:11px/1.7 "IBM Plex Mono",ui-monospace,monospace;color:var(--sec)}
.reset code{background:#F1F5F9;border:1px solid var(--border);padding:1px 4px;border-radius:4px}
@media(max-width:480px){.card{padding:24px 20px}}
[data-palette=blue]{--brand:#2563EB}[data-palette=teal]{--brand:#0F766E}[data-palette=emerald]{--brand:#047857}[data-palette=rose]{--brand:#E11D48}[data-palette=amber]{--brand:#B45309}[data-palette=graphite]{--brand:#475569}
:root[data-palette]{--brand-h:color-mix(in srgb,var(--brand) 86%,#000)}
[data-theme=dark]{color-scheme:dark;--bg:#0B1020;--border:#27314A;--ink:#E8ECF6;--sec:#A9B4CC}
[data-theme=dark] .card{background:#131A2B}[data-theme=dark] .f input{background:#0B1020}[data-theme=dark] .f input:focus{background:#131A2B}
[data-theme=dark] .reset{border-top-color:#27314A}[data-theme=dark] .reset code{background:#1A2338;border-color:#27314A}[data-theme=dark] .err{background:#2A1620;border-color:#5B2433;color:#FCA5A5}
.card{animation:rise .5s cubic-bezier(.22,1,.36,1) both}.f input,button{transition:border-color .2s,box-shadow .2s,background .2s,transform .1s}button:active{transform:scale(.98)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.brand{gap:14px}.brand svg{display:block;flex:none;overflow:visible}.bmark{width:42px;height:42px}.bmark circle{fill:var(--brand)}
.bmark g{fill:none;stroke-width:26;stroke-linecap:round;stroke-linejoin:round}.bmark .m1{stroke:#fff}.bmark .m2{stroke:rgba(255,255,255,.7)}
.wm{height:26px;width:auto}.wm g{fill:none;stroke-linecap:round;stroke-linejoin:round}.wm .a{stroke:var(--ink)}.wm .b{stroke:var(--brand)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><svg class="bmark" viewBox="-100 -100 200 200" aria-hidden="true"><circle r="100"/><g class="m2"><path d="M0.00 -14.00 A24.00 24.00 0 0 1 48.00 -14.00 L48.00 38.00"/></g><g class="m1"><path d="M-48.00 -38.00 L-48.00 38.00 M-48.00 -14.00 A24.00 24.00 0 0 1 0.00 -14.00 L0.00 38.00"/></g></svg><svg class="wm" viewBox="-9.0 -9.0 625.7 140.2" role="img" aria-label="merger"><g class="a" stroke-width="18.04"><path d="M0.00 0.00 L0.00 82.00 M0.00 29.11 A29.11 29.11 0 0 1 58.22 29.11 L58.22 82.00 M58.22 29.11 A29.11 29.11 0 0 1 116.44 29.11 L116.44 82.00 M150.06 41.00 L232.06 41.00 M232.06 41.00 A41.00 41.00 0 1 0 220.05 69.99 M265.68 0.00 L265.68 82.00 M265.68 24.60 A24.60 24.60 0 0 1 290.28 0.00 L304.22 0.00"/></g><g class="b" stroke-width="18.04"><path d="M419.84 41.00 A41.00 41.00 0 0 1 337.84 41.00 A41.00 41.00 0 0 1 419.84 41.00 M419.84 0.00 L419.84 101.68 A20.50 20.50 0 0 1 384.84 116.18 M453.46 41.00 L535.46 41.00 M535.46 41.00 A41.00 41.00 0 1 0 523.45 69.99 M569.08 0.00 L569.08 82.00 M569.08 24.60 A24.60 24.60 0 0 1 593.68 0.00 L607.62 0.00"/></g></svg></div>
  <h2 id="page-title">Sign in to storage pool</h2>
  <p class="sub" id="page-subtitle">Provide infrastructure administrator authorization credentials.</p>

  <div class="card">
    <div class="err" id="error-alert" role="alert" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      <span id="error-message"></span>
    </div>

    <form id="login-form" novalidate>
      <div class="f"><label for="email">Admin Email Address</label>
        <input id="email" name="email" type="email" autocomplete="email" required autofocus></div>
      <div class="f"><label for="password">Account Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <div class="f" id="confirm-row" hidden><label for="confirm">Confirm Password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password"></div>
      <label class="rm" id="remember-row"><input id="remember" name="remember" type="checkbox">Remember active terminal device</label>
      <button type="submit" id="submit-btn">Sign In To Pool</button>
    </form>

    <p class="reset">Password recovery: terminate the program, delete <code>auth.json</code> from the application folder, and restart to create a new admin profile.</p>
  </div>
</div>

<script>
const backendMode = "__MODE__"; // the server swaps this for "setup" or "signin"
const $ = id => document.getElementById(id);

if (backendMode === 'setup') {
  $('page-title').textContent = "Initialize Core Dashboard";
  $('page-subtitle').textContent = "Create the master admin credentials. Use at least 10 characters.";
  $('confirm-row').hidden = false;
  $('confirm').required = true;
  $('remember-row').hidden = true;
  $('password').autocomplete = 'new-password';
  $('submit-btn').textContent = "Initialize Admin Pool Node";
}

function showError(msg) { $('error-message').textContent = msg; $('error-alert').hidden = false; }

$('login-form').addEventListener('submit', async event => {
  event.preventDefault();
  $('error-alert').hidden = true;
  const email = $('email').value, password = $('password').value, confirm = $('confirm').value, remember = $('remember').checked;
  if (backendMode === 'setup' && password !== confirm) return showError("Administrative configuration passwords do not match.");
  $('submit-btn').disabled = true;
  try {
    const response = await fetch('/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, confirm, remember })
    });
    const data = await response.json();
    if (response.ok && data.ok) { window.location.href = "/"; return; }
    showError(data.error || "System credential negotiation mismatch exception.");
  } catch (err) {
    showError("Failed connection to pool infrastructure server node validation path.");
  }
  $('submit-btn').disabled = false;
});
</script>
</body>
</html>
