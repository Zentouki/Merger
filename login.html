.pane{flex:1;display:flex;justify-content:center;align-items:center;padding:32px;min-width:0;overflow:auto}
form{width:100%;max-width:400px}
.logo{height:40px;display:block;margin-bottom:36px}
h1{font-size:28px;line-height:1.2;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 8px}
label{display:block;font-weight:500;font-size:14px;margin:16px 0 6px}
.in{display:flex;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:8px}
.in:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(0,122,255,.15)}
.in input{flex:1;min-width:0;border:0;background:none;color:inherit;font:inherit;padding:12px 14px;outline:0}
.in button{border:0;background:none;color:var(--mute);padding:0 12px;cursor:pointer;display:grid;place-items:center;align-self:stretch}
.row{display:flex;justify-content:space-between;align-items:center;margin:16px 0 24px;font-size:14px}
.row label{display:flex;gap:8px;align-items:center;margin:0;font-weight:400}
.row a{color:var(--acc);cursor:pointer}
.go{width:100%;border:0;border-radius:8px;background:var(--acc);color:#fff;font:600 15px Inter,system-ui,sans-serif;padding:13px;cursor:pointer}
.go:disabled{opacity:.6;cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#err{color:#d92d20;min-height:1.4em;margin:12px 0 0;font-size:14px}
#help{display:none;color:var(--mute);font-size:13px;margin:0 0 16px}
.setup-only{display:none}
body[data-mode=setup] .setup-only{display:block}body[data-mode=setup] .signin-only{display:none}
@media(max-width:900px){.hero{display:none}}
</style>

  <h1><span class="signin-only">Nice to see you again</span><span class="setup-only">Welcome to Merger</span></h1>
  <p class="sub setup-only">Create the login for this app. You only do this once.</p>
  <label for="em">Email address</label>
  <div class="in"><input id="em" type="email" placeholder="Enter your email address" autocomplete="username" required autofocus></div>
  <label for="pw">Password</label>
  <div class="in"><input id="pw" type="password" placeholder="Enter your password" autocomplete="current-password" required><button type="button" id="eye" aria-label="Show or hide password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <div class="setup-only"><label for="cf">Confirm password</label><div class="in"><input id="cf" type="password" placeholder="Repeat your password" autocomplete="new-password"></div></div>
  <div class="row"><label><input type="checkbox" id="rm"> Remember me</label><a class="signin-only" id="fg" role="button" tabindex="0">Forgot password?</a></div>
  <p id="help">Stop Merger, delete <code>auth.json</code> from the app folder, then start it again to set a new login.</p>
  <button class="go" id="go"><span class="signin-only">Sign in</span><span class="setup-only">Create account</span></button>
  <p id="err" role="alert"></p>
</form>
</main>
<script>
const $=s=>document.querySelector(s);
$('#eye').onclick=()=>{const p=$('#pw');p.type=p.type==='password'?'text':'password'};
$('#fg').onclick=()=>$('#help').style.display='block';
$('#f').onsubmit=async e=>{
  e.preventDefault();$('#err').textContent='';$('#go').disabled=true;
  try{
    const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value,password:$('#pw').value,confirm:$('#cf').value,remember:$('#rm').checked})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||'Something went wrong');
    location.href='/';
  }catch(x){$('#err').textContent=x.message;$('#go').disabled=false}
};
</script>
</body>
</html>
