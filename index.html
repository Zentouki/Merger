<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg-canvas:#F8FAFC;--bg-surface:#FFFFFF;--bg-surface-hover:#F1F5F9;--border-subtle:#E2E8F0;--text-primary:#0F172A;--text-secondary:#475569;--text-muted:#94A3B8;--brand-primary:#4F46E5;--brand-hover:#4338CA;--danger:#DC2626;--r:6px;--sz:150px}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg-canvas);color:var(--text-primary);font:14px/1.5 Inter,system-ui,sans-serif}
code{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--text-secondary)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand-primary);outline-offset:2px}
header{position:fixed;inset:0 0 auto 0;height:56px;background:var(--bg-surface);border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:12px;padding:0 20px;z-index:20}
header img{height:28px;display:block}
.search{flex:1;max-width:720px;margin:0 auto 0 20px;position:relative;display:block}
.search svg{position:absolute;left:10px;top:9px;width:18px;height:18px;stroke:var(--text-secondary);fill:none;stroke-width:2;stroke-linecap:round}
.search input{width:100%;height:36px;padding:0 12px 0 36px;border:1px solid var(--border-subtle);border-radius:var(--r);background:var(--bg-canvas);color:inherit}
.search input:focus{outline:0;border-color:var(--brand-primary);background:#fff;box-shadow:0 0 0 3px #4f46e51f}
.btn{height:34px;padding:0 14px;border:1px solid var(--border-subtle);border-radius:var(--r);background:var(--bg-surface);color:var(--text-primary);font-weight:500;display:inline-flex;align-items:center;text-decoration:none}
.btn:hover{background:var(--bg-surface-hover)}.pri{background:var(--brand-primary);border-color:var(--brand-primary);color:#fff}.pri:hover{background:var(--brand-hover)}
#side{position:fixed;top:56px;bottom:0;left:0;width:320px;background:var(--bg-surface);border-right:1px solid var(--border-subtle);padding:20px;overflow:auto}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);font-weight:600;margin:0 0 8px}
#pool{display:flex;gap:2px;height:10px;border-radius:var(--r);overflow:hidden;background:var(--border-subtle)}#pool i{display:block;height:100%}
#poolt{margin:8px 0 22px;color:var(--text-secondary);font-size:13px}
.nv{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:var(--r);color:var(--text-secondary);font-weight:500;text-decoration:none;margin-bottom:2px}
.nv:hover{background:var(--bg-surface-hover)}.nv.on{background:#EEF2FF;color:var(--brand-primary)}
#nodes{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
#nodes li{border:1px solid var(--border-subtle);border-radius:var(--r);padding:10px 12px;cursor:pointer}
#nodes li:hover{background:var(--bg-surface-hover)}#nodes li.on{border-color:var(--brand-primary)}
.nr{display:flex;align-items:center;gap:8px}.nr code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-primary)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;margin-right:6px}.nr .dot{margin:0}
.gb{height:5px;border-radius:3px;background:var(--border-subtle);margin:8px 0 4px;overflow:hidden}.gb i{display:block;height:100%}
#nodes small{color:var(--text-secondary);font-family:"JetBrains Mono",monospace;font-size:11.5px}
.lnk{border:0;background:none;color:var(--brand-primary);padding:2px 6px;font-weight:500;font-size:13px}.lnk:hover{text-decoration:underline}.lnk.red{color:var(--danger)}
main{margin:56px 0 0 320px;padding:24px 28px 60px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
#crumbs{color:var(--text-secondary);font-weight:500}#crumbs a{color:var(--brand-primary);cursor:pointer}#crumbs .btn{margin-left:10px}
.view{display:flex;align-items:center;gap:12px;color:var(--text-secondary);font-size:13px}
.view select{height:32px;border:1px solid var(--border-subtle);border-radius:var(--r);background:#fff;padding:0 8px}.view input{accent-color:var(--brand-primary)}
.tw{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);font-weight:600;padding:10px 16px;background:var(--bg-canvas);border-bottom:1px solid var(--border-subtle)}
td{padding:12px 16px;border-bottom:1px solid var(--border-subtle)}tbody tr:last-child td{border:0}tbody tr:hover{background:var(--bg-surface-hover)}
td.nm{word-break:break-word}.dir{cursor:pointer}.dir td.nm b{color:var(--brand-primary);font-weight:600}.r{text-align:right}
.act{white-space:nowrap}td.act{text-align:right}.act .lnk{opacity:0}
tr:hover .lnk,tr:focus-within .lnk,.ic:hover .lnk,.ic:focus-within .lnk{opacity:1}@media(hover:none){.act .lnk{opacity:1}}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--sz),1fr));gap:12px}
.ic{background:#fff;border:1px solid var(--border-subtle);border-radius:var(--r);overflow:hidden;min-width:0}.ic.dir:hover{border-color:var(--brand-primary)}
.ic .th{height:var(--sz);background:var(--bg-canvas);display:grid;place-items:center;font-size:calc(var(--sz)/3);overflow:hidden}.th img{width:100%;height:100%;object-fit:cover}
.ic .n{padding:8px 10px 0;font-weight:500;word-break:break-word}.ic .act{padding:4px 6px 8px;white-space:normal}
.empty{padding:48px 16px;text-align:center;color:var(--text-muted)}
body.drag .tw,body.drag #grid{outline:2px dashed var(--brand-primary);outline-offset:4px}
#scrim{position:fixed;inset:0;background:transparent;z-index:30;display:none}body.open #scrim{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:576px;background:var(--bg-surface);border-left:1px solid var(--border-subtle);box-shadow:-12px 0 32px #0f172a1a;z-index:40;transform:translateX(100%);visibility:hidden;transition:transform .25s,visibility .25s;display:flex;flex-direction:column}
body.open #drawer{transform:none;visibility:visible}
.dh{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border-subtle)}.dh h2{margin:0;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:0;background:none;font-size:24px;line-height:1;color:var(--text-secondary);padding:4px 8px}
.db{padding:20px;overflow:auto;flex:1;display:flex;flex-direction:column}
.db label{display:block;margin:14px 0 6px;font-weight:500;color:var(--text-secondary)}.db label:first-child{margin-top:0}
.db input,.db select,.db textarea{width:100%;border:1px solid var(--border-subtle);border-radius:var(--r);padding:8px 10px;background:#fff;color:inherit}
.db textarea{flex:1;min-height:300px;font-family:"JetBrains Mono",monospace;font-size:13px;resize:none}
.hint{color:var(--text-secondary);font-size:13px}.ft{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.db table{min-width:0}.db td,.db th{padding:8px 10px}
#toast{position:fixed;right:20px;bottom:20px;background:var(--text-primary);color:#fff;padding:10px 14px;border-radius:var(--r);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:420px}#toast.show{opacity:1}#toast.bad{background:var(--danger)}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--border-subtle);margin-bottom:16px}
.tab{border:0;background:none;padding:10px 2px;margin-bottom:-1px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary);border-bottom:2px solid transparent}
.tab:hover{color:var(--text-primary)}.tab.on{color:var(--brand-primary);border-bottom-color:var(--brand-primary)}
.ac{display:inline-block;padding:1px 6px;border:1px solid var(--border-subtle);background:var(--bg-surface-hover);border-radius:4px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-primary);white-space:nowrap}
.ac.bad{background:#FEF2F2;border-color:#FECACA;color:var(--danger)}
#audit td{padding:10px 16px;vertical-align:top;word-break:break-word}#audit td:first-child{white-space:nowrap}
#nodes li.err{border-color:#FECACA;background:#FEF2F2}#nodes li.err small{color:var(--danger)}
.ribbon{display:grid;grid-template-columns:240px 1fr auto;gap:12px;align-items:end;margin-bottom:16px}
.flt{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}
.flt select{height:40px;border:1px solid var(--border-subtle);border-radius:var(--r);background:#fff;padding:0 10px;color:var(--text-primary);font-size:13px;font-weight:500;text-transform:none;letter-spacing:0}
.drop{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:8px 16px;border:2px dashed var(--border-subtle);border-radius:var(--r);background:#fff;color:var(--text-secondary);font-weight:500;text-align:left}
.drop svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.drop b{color:var(--brand-primary);font-weight:600}.drop small{margin-left:auto;font:11px "JetBrains Mono",monospace;color:var(--text-secondary);text-align:right}
.drop:hover,body.drag .drop{border-color:var(--brand-primary);background:#EEF2FF}
.nf{display:flex;gap:8px;align-items:center}
.nf input{height:40px;width:170px;border:1px solid var(--border-subtle);border-radius:var(--r);padding:0 10px;background:#fff;font:inherit;color:inherit}
.nf .btn{height:40px;background:#EEF2FF;border-color:#C7D2FE;color:var(--brand-primary);font-weight:600;white-space:nowrap}.nf .btn:hover{background:#E0E7FF}
.hc{display:inline-flex;align-items:center;white-space:nowrap}
@media(max-width:1100px){.ribbon{grid-template-columns:240px 1fr}.nf{grid-column:1/-1}}
@media(max-width:700px){.ribbon{grid-template-columns:1fr}.drop small{display:none}}
@media(prefers-reduced-motion:reduce){#drawer,#toast{transition:none}}
@media(max-width:900px){#side{position:static;width:auto;border:0;border-bottom:1px solid var(--border-subtle)}main{margin:0;padding:16px}body{padding-top:56px}.search{margin-left:4px}header img{display:none}}
</style>
</head>

<script>
const $=s=>document.querySelector(s),enc=encodeURIComponent,FOLDER='application/vnd.google-apps.folder',J={'Content-Type':'application/json'};
const COL=['#4F46E5','#0EA5E9','#10B981','#F59E0B','#F43F5E','#64748B'];
let accts=[],path=[],query='',list=[],mode='files',view=localStorage.getItem('view')||'table',size=+localStorage.getItem('size')||150;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{const u=['B','KB','MB','GB','TB'];let i=0;n=+n||0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]};
const mb=n=>((+n||0)/1048576).toFixed(2)+' MB';
const color=e=>COL[Math.max(0,accts.findIndex(a=>a.email===e))%COL.length];
const isText=f=>f.mimeType.startsWith('text/')||/^application\/(json|xml|javascript|x-javascript)$/.test(f.mimeType);
async function api(u,o){const r=await fetch(u,o);if(r.status===401){location.href='/login';return}if(!r.ok){let m;try{m=(await r.json()).error}catch{}throw new Error(m||r.statusText)}return r.status===204?null:r.json()}
const post=(u,b)=>api(u,{method:'POST',headers:J,body:JSON.stringify(b)});
function say(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'bad show':'show';clearTimeout(say.t);say.t=setTimeout(()=>t.className='',4500)}
function panel(t,h){$('#drawer').innerHTML=`<div class="dh"><h2>${esc(t)}</h2><button class="x" data-close aria-label="Close">×</button></div><div class="db">${h}</div>`;document.body.classList.add('open');$('#drawer .db').querySelector('input,select,textarea')?.focus()}
const closePanel=()=>document.body.classList.remove('open');
addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});

function drawNodes(){
  const ok=accts.filter(a=>!a.error&&!a.loading),wait=accts.some(a=>a.loading),unl=ok.some(a=>a.limit==null);
  const used=ok.reduce((s,a)=>s+a.used,0),lim=ok.reduce((s,a)=>s+(a.limit||0),0),den=unl?used||1:lim||1;
  $('#pool').innerHTML=ok.map(a=>`<i style="width:${a.used/den*100}%;background:${color(a.email)}" title="${esc(a.email)}"></i>`).join('');
  $('#poolt').innerHTML=accts.length?`<code>${fmt(used)}${unl?'':' / '+fmt(lim)}</code>${unl?'':` <code>(${fmt(lim-used)} free)</code>`}${wait?' <code>· checking…</code>':''}`:'No accounts linked';
  $('#nodes').innerHTML=accts.map(a=>`<li data-go="${esc(a.email)}"${a.error?' class="err"':''}><div class="nr"><span class="dot" style="background:${color(a.email)}"></span><code>${esc(a.email)}</code><button class="lnk red" data-rm="${esc(a.email)}">Unlink</button></div><div class="gb"><i style="width:${a.limit?a.used/a.limit*100:0}%;background:${color(a.email)}"></i></div><small>${a.loading?'Checking…':a.error?'Offline · token expired or revoked · <a class="lnk" href="/auth/add">Re-link</a>':fmt(a.used)+(a.limit?' / '+fmt(a.limit):'')}</small></li>`).join('');
  document.querySelectorAll('#nodes li').forEach(l=>l.classList.toggle('on',mode==='files'&&path[0]?.acct===l.dataset.go));
}
async function loadAccounts(){  // draws the sidebar at once, then fills in each account as its answer arrives
  const prev=Object.fromEntries(accts.map(a=>[a.email,a]));
  accts=((await api('/api/nodes'))||[]).map(n=>prev[n.email]||{email:n.email,loading:true});
  drawNodes();
  accts.forEach(async a=>{
    let r;try{r=await api('/api/node?email='+enc(a.email))}catch(e){r={email:a.email,error:e.message}}
    const k=accts.findIndex(x=>x.email===a.email);if(k>=0&&r){accts[k]=r;drawNodes()}
  });
}
function actions(f){
  if(mode==='trash')return'<button class="lnk" data-a="restore">Restore</button><button class="lnk red" data-a="purge">Delete forever</button>';
  const d=f.mimeType===FOLDER;
  return(d?'':'<button class="lnk" data-a="dl">Download</button>')+(!d&&isText(f)?'<button class="lnk" data-a="edit">Edit Text</button>':'')+'<button class="lnk" data-a="share">Share</button><button class="lnk" data-a="move">Move</button><button class="lnk red" data-a="del">Trash</button>';
}
const isDir=f=>f.mimeType===FOLDER&&mode==='files';
const row=(f,i)=>`<tr${isDir(f)?' class="dir"':''} data-x="${i}" title="${esc(f.modifiedTime||'')}"><td class="nm">${f.mimeType===FOLDER?'📁 <b>'+esc(f.name)+'</b>':(f.icon||'📄')+' '+esc(f.name)}</td><td><span class="dot" style="background:${color(f.account)}"></span><code>${esc(f.account)}</code></td><td><code>${f.mimeType===FOLDER?'—':mb(f.size)}</code></td><td class="act">${actions(f)}</td></tr>`;
const card=(f,i)=>`<div class="ic${isDir(f)?' dir':''}" data-x="${i}"><div class="th">${f.thumb?`<img loading="lazy" alt="" src="/api/thumb?account=${enc(f.account)}&id=${f.id}">`:f.mimeType===FOLDER?'📁':(f.icon||'📄')}</div><div class="n">${esc(f.name)}</div><div class="act">${actions(f)}</div></div>`;

async function loadFiles(){
  showTab('explorer');
  const cur=path[path.length-1],p=new URLSearchParams();
  if(mode==='trash')p.set('trash','1');else if(query)p.set('q',query);else if(cur){p.set('account',cur.acct);p.set('folder',cur.id);p.set('name',cur.name)}
  let r={files:[],errors:[]};if(accts.length)r=(await api('/api/files?'+p))||r;all=r.files;list=all.filter(pass);
  if(r.errors.length)say(`Couldn't read ${r.errors.join(', ')}. Re-link ${r.errors.length>1?'those accounts':'that account'}.`,1);
  $('#nAll').classList.toggle('on',mode==='files');$('#nTrash').classList.toggle('on',mode==='trash');
  document.querySelectorAll('#nodes li').forEach(l=>l.classList.toggle('on',mode==='files'&&path[0]?.acct===l.dataset.go));
  $('#crumbs').innerHTML=mode==='trash'?'Trash <button class="btn" id="et">Empty trash</button>':query?`Results for “${esc(query)}” <button class="btn" id="clr">Clear</button>`:['<a data-i="-1">All accounts</a>',...(path.length&&path[0].id!=='root'?[`<span class="hc"><span class="dot" style="background:${color(path[0].acct)}"></span><code>${esc(path[0].acct)}</code></span>`]:[]),...path.map((x,i)=>`<a data-i="${i}">${esc(x.name)}</a>`)].join(' / ');
  render();
}
function render(){
  $('#count').textContent=(ftype==='all'?list.length:list.length+' of '+all.length)+' items';
  $('#tbl').hidden=view!=='table'||!list.length;$('#grid').hidden=view==='table'||!list.length;
  $('#rows').innerHTML=list.map(row).join('');$('#grid').innerHTML=list.map(card).join('');
  $('#empty').innerHTML=list.length?'':`<div class="empty">${!accts.length?'Link a Google account to begin.':mode==='trash'?'Trash is empty.':'Nothing here. Drop files anywhere to upload.'}</div>`;
  $('#ribbon').hidden=mode==='trash';
  const cur=path[path.length-1];{const t=mode==='trash'?'Trash':query?'Search results':cur?cur.name:'';document.title=t?t+' — Merger':'Merger'}$('#dzs').textContent=cur&&mode==='files'?'Uploads into '+cur.name:'Auto-routes to the account with the most free space';
}
const refresh=async()=>{try{await loadAccounts();await loadFiles()}catch(e){say(e.message,1)}};
function applyView(){$('#vw').value=view;$('#sz').value=size;$('#szw').hidden=view==='table';document.documentElement.style.setProperty('--sz',size+'px');localStorage.setItem('view',view);localStorage.setItem('size',size)}

async function up(files){
  const cur=path[path.length-1];
  for(const f of files){
    say(`Uploading ${f.name}…`);const fd=new FormData();fd.append('file',f);
    if(cur&&mode==='files'){fd.append('account',cur.acct);fd.append('folder',cur.id)}
    try{const r=await api('/api/upload',{method:'POST',body:fd});say(`${f.name} uploaded to ${r.account}`)}catch(e){say(`${f.name}: ${e.message}`,1)}
  }
  refresh();
}
function newDlg(){
  const cur=path[path.length-1];
  panel('New',`<label>Type<select id="nt"><option value="doc">Google Doc</option><option value="sheet">Google Sheet</option><option value="slide">Google Slides</option><option value="text">Text file</option><option value="folder">Folder</option></select></label><label>Name<input id="nn"></label>${cur?'':`<label>Account<select id="na"><option value="">Most free space</option>${accts.map(a=>`<option>${esc(a.email)}</option>`).join('')}</select></label>`}<div class="ft"><button class="btn" data-close>Cancel</button><button class="btn pri" id="go">Create</button></div>`);
  $('#go').onclick=async()=>{const name=$('#nn').value.trim();if(!name)return;
    try{const r=await post('/api/new',{type:$('#nt').value,name,account:cur?cur.acct:$('#na').value,folder:cur?.id});closePanel();say(`Created in ${r.account}`);refresh()}catch(e){say(e.message,1)}};
}
function shareDlg(f){
  panel('Share '+f.name,`<label>Email<input id="se" type="email"></label><label>Access<select id="sr"><option value="reader">Can view</option><option value="commenter">Can comment</option><option value="writer">Can edit</option></select></label><div class="ft"><button class="btn" data-close>Cancel</button><button class="btn pri" id="go">Share</button></div>`);
  $('#go').onclick=async()=>{try{await post('/api/share',{account:f.account,id:f.id,name:f.name,email:$('#se').value.trim(),role:$('#sr').value});closePanel();say('Shared')}catch(e){say(e.message,1)}};
}
async function editDlg(f){
  try{
    const u=`/api/content?account=${enc(f.account)}&id=${f.id}`,r=await api(u);
    panel('Edit '+f.name,'<textarea id="tx" spellcheck="false"></textarea><div class="ft"><button class="btn" data-close>Cancel</button><button class="btn pri" id="go">Save</button></div>');
    $('#tx').value=r.text;
    $('#go').onclick=async()=>{try{await api(u,{method:'PUT',headers:J,body:JSON.stringify({text:$('#tx').value})});closePanel();say('Saved')}catch(e){say(e.message,1)}};
  }catch(e){say(e.message,1)}
}
function moveDlg(f){
  panel('Move '+f.name,`<label>Destination account<select id="ma">${accts.filter(a=>!a.error).map(a=>`<option${a.email===f.account?' selected':''}>${esc(a.email)}</option>`).join('')}</select></label><label>Folder<select id="mf"></select></label><p class="hint">Moving to another account copies the file, then puts the original in Trash. Google Docs, Sheets and Slides are converted to Word, Excel and PowerPoint. Folders can only move within one account.</p><div class="ft"><button class="btn" data-close>Cancel</button><button class="btn pri" id="go">Move</button></div>`);
  const fill=async()=>{const r=await api(`/api/files?account=${enc($('#ma').value)}&folder=root`);$('#mf').innerHTML='<option value="">Top level</option>'+r.files.filter(x=>x.mimeType===FOLDER&&x.id!==f.id).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')};
  $('#ma').onchange=()=>fill().catch(()=>0);fill().catch(()=>0);
  $('#go').onclick=async()=>{$('#go').disabled=true;say('Moving…');
    try{await post('/api/move',{account:f.account,id:f.id,name:f.name,to_account:$('#ma').value,to_folder:$('#mf').value});closePanel();say('Moved');refresh()}catch(e){say(e.message,1);$('#go').disabled=false}};
}
const q=f=>`account=${enc(f.account)}&id=${f.id}&name=${enc(f.name)}`;
document.addEventListener('click',async e=>{
  const t=e.target,b=t.closest('[data-a]'),rw=t.closest('[data-x]'),f=rw&&list[+rw.dataset.x];
  if(t.closest('[data-close]'))return closePanel();
  try{
    if(t.dataset.rm){if(confirm(`Unlink ${t.dataset.rm}? Its files stay in Google Drive.`)){await api('/api/accounts/'+enc(t.dataset.rm),{method:'DELETE'});path=[];refresh()}}
    else if(t.closest('[data-go]')&&!t.closest('a')){const g=t.closest('[data-go]').dataset.go;mode='files';path=[{id:'root',acct:g,name:g}];query='';$('#q').value='';loadFiles()}
    else if(b){const a=b.dataset.a;
      if(a==='dl')location.href=`/api/download?account=${enc(f.account)}&id=${f.id}`;
      else if(a==='edit')editDlg(f);else if(a==='share')shareDlg(f);else if(a==='move')moveDlg(f);
      else if(a==='del'){if(confirm(`Move “${f.name}” to Trash?`)){await api(`/api/files?${q(f)}`,{method:'DELETE'});say('Moved to Trash');refresh()}}
      else if(a==='restore'){await post('/api/restore',{account:f.account,id:f.id,name:f.name});say('Restored');refresh()}
      else if(a==='purge'){if(confirm(`Permanently delete “${f.name}”? This can't be undone.`)){await api(`/api/purge?${q(f)}`,{method:'DELETE'});say('Deleted forever');refresh()}}}
    else if(t.id==='et'){if(confirm('Permanently delete everything in Trash in every account? This can\'t be undone.')){const r=await post('/api/emptytrash',{});say(r&&r.failed.length?`Couldn't empty: ${r.failed.join(', ')}`:'Trash emptied',!!(r&&r.failed.length));refresh()}}
    else if(t.dataset.i!==undefined&&t.tagName==='A'){path=path.slice(0,+t.dataset.i+1);loadFiles()}
    else if(t.id==='clr'){query='';$('#q').value='';loadFiles()}
    else if(rw&&rw.classList.contains('dir')){path.push({id:f.id,acct:f.account,name:f.name});query='';$('#q').value='';loadFiles()}
  }catch(x){say(x.message,1)}
});
function showTab(t){
  $('#pExp').hidden=t!=='explorer';$('#pAudit').hidden=t!=='audit';
  $('#tExp').classList.toggle('on',t==='explorer');$('#tAud').classList.toggle('on',t==='audit');
  $('#nHist').classList.toggle('on',t==='audit');
  if(t==='audit'){$('#nAll').classList.remove('on');$('#nTrash').classList.remove('on')}
}
async function loadAudit(){
  const h=(await api('/api/history'))||[];
  $('#audit').innerHTML=h.map(r=>`<tr><td><code>${esc(r.t)}</code></td><td><span class="ac${/failed/.test(r.action)?' bad':''}">${esc(r.action)}</span></td><td><code>${esc(r.account)}</code></td><td>${esc(r.name||'—')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No activity recorded yet.</td></tr>';
  $('#acount').textContent=h.length?`${h.length} most recent events, newest first`:'';
}
const openAudit=()=>{showTab('audit');loadAudit().catch(x=>say(x.message,1))};
$('#tAud').onclick=openAudit;$('#nHist').onclick=openAudit;$('#aref').onclick=openAudit;
$('#tExp').onclick=()=>showTab('explorer');
let all=[],ftype='all';
const MEDIA=/^(image|video|audio)\//,DOCS=/pdf|document|spreadsheet|presentation|msword|officedocument|opendocument/;
const pass=f=>ftype==='all'||(ftype==='folders'?f.mimeType===FOLDER:ftype==='text'?isText(f):ftype==='media'?MEDIA.test(f.mimeType):DOCS.test(f.mimeType));
$('#tf').onchange=e=>{ftype=e.target.value;list=all.filter(pass);render()};
$('#dz').onclick=()=>$('#file').click();
$('#nf-form').onsubmit=async e=>{
  e.preventDefault();const name=$('#nfn').value.trim();if(!name)return;
  const cur=!query&&path[path.length-1];  // inside a folder: create there; at the top level: the account with the most space
  try{const r=await post('/api/new',{type:'folder',name,account:cur?cur.acct:'',folder:cur?cur.id:undefined});$('#nfn').value='';say(`Folder “${name}” created in ${r.account}`);refresh()}catch(x){say(x.message,1)}
};
$('#nAll').onclick=()=>{mode='files';path=[];query='';$('#q').value='';loadFiles().catch(x=>say(x.message,1))};
$('#nTrash').onclick=()=>{mode='trash';loadFiles().catch(x=>say(x.message,1))};
$('#lo').onclick=async()=>{await fetch('/logout',{method:'POST'});location.href='/login'};
$('#q').addEventListener('input',()=>{clearTimeout($('#q').t);$('#q').t=setTimeout(()=>{query=$('#q').value.trim();mode='files';loadFiles().catch(x=>say(x.message,1))},350)});
$('#file').addEventListener('change',e=>{up([...e.target.files]);e.target.value=''});
$('#mk').onclick=newDlg;$('#vw').onchange=e=>{view=e.target.value;applyView();loadFiles().catch(()=>0)};$('#sz').oninput=e=>{size=+e.target.value;applyView()};
['dragenter','dragover'].forEach(n=>addEventListener(n,e=>{e.preventDefault();document.body.classList.add('drag')}));
['dragleave','drop'].forEach(n=>addEventListener(n,e=>{e.preventDefault();document.body.classList.remove('drag')}));
addEventListener('drop',e=>{if(e.dataTransfer.files.length)up([...e.dataTransfer.files])});
applyView();refresh();
</script>
</body>
</html>
